name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 获取版本信息
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      - name: Get version from tag
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG, Version: $VERSION"

  # 构建 Android
  build-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android AppBundle
        run: flutter build appbundle --release

      - name: Rename APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/book_reader_android_${{ needs.version.outputs.version }}.apk

      - name: Rename AppBundle
        run: |
          cp build/app/outputs/bundle/release/app-release.aab output/book_reader_android_${{ needs.version.outputs.version }}.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: output/*

  # 构建 Windows
  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create Windows ZIP
        run: |
          New-Item -ItemType Directory -Force -Path output
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath output\book_reader_windows_${{ needs.version.outputs.version }}.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: output/*

  # 构建 Linux
  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create Linux tarball
        run: |
          mkdir -p output
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../output/book_reader_linux_${{ needs.version.outputs.version }}.tar.gz *
          cd ../../../../../

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: output/*

  # 创建 Release 并上传
  release:
    needs: [version, build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 下载所有构建产物
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: artifacts/android

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: artifacts/linux

      # 列出所有文件
      - name: List artifacts
        run: |
          echo "All artifacts:"
          find artifacts -type f

      # 创建或更新触发 tag 的 Release
      - name: Create Release for tag
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/android/*
            artifacts/windows/*
            artifacts/linux/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 处理 latest tag
      - name: Update latest release
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${{ needs.version.outputs.version }}"

          echo "Processing latest release..."

          # 检查是否存在 latest release
          LATEST_RELEASE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest" | jq -r '.id // empty')

          if [ -n "$LATEST_RELEASE" ]; then
            echo "Found existing latest release with ID: $LATEST_RELEASE"
            
            # 删除现有的 latest release
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$LATEST_RELEASE"
            echo "Deleted existing latest release"
            
            # 删除 latest tag
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/latest"
            echo "Deleted existing latest tag"
          fi

          # 创建新的 latest tag 指向当前 commit
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\": \"refs/tags/latest\", \"sha\": \"${{ github.sha }}\"}" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs"
          echo "Created new latest tag"

          # 创建新的 latest release
          RELEASE_DATA=$(cat <<EOF
          {
            "tag_name": "latest",
            "name": "Latest Release (v${VERSION})",
            "body": "This is the latest release based on ${TAG}.\n\n**Note:** This release is automatically updated and always points to the most recent tagged release.",
            "draft": false,
            "prerelease": false
          }
          EOF
          )

          RELEASE_RESPONSE=$(curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$RELEASE_DATA" \
            "https://api.github.com/repos/${{ github.repository }}/releases")

          LATEST_RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')
          echo "Created latest release with ID: $LATEST_RELEASE_ID"

          # 上传文件到 latest release
          for file in artifacts/*/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Uploading $filename to latest release..."
              
              # 使用 GitHub API 上传资源
              curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$file" \
                "https://uploads.github.com/repos/${{ github.repository }}/releases/$LATEST_RELEASE_ID/assets?name=$filename"
              
              echo "Uploaded $filename"
            fi
          done

          echo "Latest release updated successfully!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
