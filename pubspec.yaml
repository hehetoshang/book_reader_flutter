name: universal_reader
description: "一款支持PDF和EPUB的跨平台阅读器，覆盖手机、平板、桌面和网页"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI相关
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.7296
  
  # 状态管理
  provider: ^6.1.2
  
  # 路由管理
  go_router: ^14.2.0
  
  # PDF阅读器（全平台支持）
  pdfrx: ^2.2.15
  
  # EPUB阅读器（使用 flutter_epub_viewer）
  flutter_epub_viewer: ^1.2.0
  
  # 文件选择（全平台支持）
  file_picker: ^8.0.0
  
  # 权限处理
  permission_handler: ^11.3.0
  
  # 本地存储
  shared_preferences: ^2.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # 文件路径
  path_provider: ^2.1.0
  
  # 工具类
  intl: ^0.20.2
  url_launcher: ^6.2.0
  device_info_plus: ^10.0.0
  package_info_plus: ^8.0.0
  
  # 桌面端支持
  window_manager: ^0.3.9
  
  # 拖拽支持
  desktop_drop: ^0.5.0
  
  # 快捷键支持 (使用 Flutter 内置的 Shortcuts widget)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  # 国际化支持
  generate: true
